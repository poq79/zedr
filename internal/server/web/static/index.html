<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>HostGuard 总控管理后台</title>
<link rel="stylesheet" href="/styles.css" />
<!-- Alpine.js 3.17.5：经 npm registry SHA512 校验后本地化嵌入（无 CDN 依赖）。
     用于命令面板与事件页的声明式绑定；既有视图保持原生实现，渐进迁移。 -->
<script defer src="/vendor/alpine.min.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233d8bfd'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%2304101f'%3EH%3C/text%3E%3C/svg%3E" />
</head>
<body>

<!-- ============ 登录 ============ -->
<div class="login-wrap" id="loginWrap" style="display:none">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-brand">
      <span class="login-logo">H</span>
      <div>
        <h1>HostGuard</h1>
        <p class="sub">主机进程安全检测 · 总控管理后台</p>
      </div>
    </div>
    <div class="login-err" id="loginErr"></div>
    <label class="field">
      <span>账号</span>
      <input name="username" id="loginUser" autocomplete="username" placeholder="admin" required style="width:100%" />
    </label>
    <label class="field">
      <span>密码</span>
      <input name="password" id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" required style="width:100%" />
    </label>
    <button class="btn primary" type="submit" id="loginBtn" style="width:100%;padding:10px">登录</button>
    <p class="small muted" style="margin:16px 0 0;line-height:1.6">
      首次部署时，服务端日志会打印一次初始管理员密码。登录后请尽快在「账号」页修改。
    </p>
  </form>
</div>

<!-- ============ 主体 ============ -->
<div id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">H</div>
      <div class="brand-text"><b>HostGuard</b><span>PROCESS SECURITY</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="avatar">A</div>
        <div class="user-meta">
          <b id="userName">-</b>
          <span id="userRole">-</span>
        </div>
      </div>
      <button class="nav-item" id="logoutBtn" style="margin-top:6px">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span> 退出登录
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">概览</h1>
      <div class="spacer"></div>
      <div class="live-label off" id="liveIndicator"><span class="live-dot"></span><span id="liveText">实时通道未连接</span></div>
      <span class="freshness" id="freshness" title="数据最后更新时间">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="freshnessText"></span>
      </span>
      <button class="btn sm ghost" id="refreshBtn" title="重新拉取数据（R）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        刷新
      </button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- ============ 告警详情抽屉 ============ -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div style="flex:1;min-width:0">
      <h2 id="drawerTitle">告警详情</h2>
      <div id="drawerSub" class="small muted"></div>
    </div>
    <button class="icon-btn" id="drawerClose" title="关闭（Esc）" aria-label="关闭详情">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<div id="toasts"></div>

<script src="/app.js"></script>
<!-- ============ Ctrl+K 命令面板（Alpine 组件） ============ -->
<div x-data="cmdk" x-show="open" x-cloak style="display:none"
     x-on:keydown.escape.window="open=false"
     class="cmdk-mask" x-on:click.self="open=false">
  <div class="cmdk" x-show="open" x-transition.opacity.duration.120ms>
    <input class="cmdk-input" type="text" placeholder="跳转页面、执行操作…（支持：告警 / 主机 / 事件 / 规则 / 导出）"
           x-model="q" x-ref="input" x-effect="if (open) $nextTick(() => $refs.input.focus())"
           x-on:keydown.down.prevent="move(1)" x-on:keydown.up.prevent="move(-1)"
           x-on:keydown.enter.prevent="run()" />
    <div class="cmdk-list">
      <template x-for="(item, i) in filtered" :key="item.id">
        <button class="cmdk-item" :class="i === sel ? 'active' : ''" @click="pick(item)"
                x-text="''" x-html="(item.icon ? '<span class=cmdk-ico>' + item.icon + '</span>' : '') + '<span>' + item.label + '</span>' + (item.hint ? '<span class=cmdk-hint>' + item.hint + '</span>' : '')"></button>
      </template>
      <div x-show="filtered.length === 0" class="empty small" style="padding:18px">没有匹配的命令，换个关键词试试</div>
    </div>
    <div class="cmdk-foot">
      <span><span class="kbd">↑</span><span class="kbd">↓</span> 选择</span>
      <span><span class="kbd">Enter</span> 执行</span>
      <span><span class="kbd">Esc</span> 关闭</span>
    </div>
  </div>
</div>

</body>
</html>
