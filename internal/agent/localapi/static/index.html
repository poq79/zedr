<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Z-EDR · 本机防护</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<a class="skip-link" href="#main">跳到主要内容</a>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.5 4.5 5.5v5.6c0 4.8 3.1 8.1 7.5 9.6 4.4-1.5 7.5-4.8 7.5-9.6V5.5L12 2.5Z"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Z-EDR</div>
        <div class="brand-sub">本机防护</div>
      </div>
    </div>

    <nav class="nav" aria-label="主导航">
      <div class="nav-group">监控</div>
      <a class="nav-item" href="#/overview" data-nav="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
        </svg>
        <span>总览</span>
      </a>
      <a class="nav-item" href="#/activity" data-nav="activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12h4l2.5-7 4 14L16 12h5"/>
        </svg>
        <span>活动</span>
        <span class="nav-count" id="navAlertCount" hidden></span>
      </a>
      <a class="nav-item" href="#/processes" data-nav="processes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/>
        </svg>
        <span>进程</span>
      </a>
      <a class="nav-item" href="#/persist" data-nav="persist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 2 9 4.9-9 4.9L3 6.9 12 2Z"/><path d="m3 11.8 9 4.9 9-4.9"/><path d="m3 16.7 9 4.9 9-4.9"/>
        </svg>
        <span>驻留</span>
      </a>
      <div class="nav-group">体检</div>
      <a class="nav-item" href="#/posture" data-nav="posture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9z"/><path d="m9 14 2 2 4-5"/>
        </svg>
        <span>安全体检</span>
      </a>
      <a class="nav-item" href="#/apps" data-nav="apps">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/>
        </svg>
        <span>软件资产</span>
      </a>
      <a class="nav-item" href="#/browser" data-nav="browser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
        </svg>
        <span>浏览器</span>
      </a>
      <div class="nav-group">管理</div>
      <a class="nav-item" href="#/trust" data-nav="trust">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2.5 4.5 5.5v5.6c0 4.8 3.1 8.1 7.5 9.6 4.4-1.5 7.5-4.8 7.5-9.6V5.5L12 2.5Z"/><path d="m8.5 11.8 2.4 2.4 4.6-5"/>
        </svg>
        <span>信任与隐私</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="side-status" id="sideStatus">
        <span class="dot" id="sideDot"></span>
        <span id="sideState">正在连接</span>
      </div>
      <div class="side-version" id="sideVersion">Z-EDR · —</div>
      <div class="side-actions">
        <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="切换深浅主题" title="切换深浅主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/>
          </svg>
        </button>
        <button class="icon-btn" id="cmdBtn" data-act="palette" aria-label="打开命令面板" title="命令面板（Ctrl+K）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 3H5a2 2 0 0 0-2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 3h4a2 2 0 0 1 2 2v4M15 21h4a2 2 0 0 0 2-2v-4"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">
        <h1 id="pageTitle">总览</h1>
        <span class="page-sub" id="pageSub">本机安全状态</span>
      </div>
      <div class="topbar-right">
        <div class="host-chip" id="hostChip" hidden></div>
        <div class="freshness" title="数据新鲜度">
          <span class="live-dot" id="liveDot"></span>
          <span id="freshText">正在连接</span>
        </div>
        <button class="btn sm" id="scanBtn" data-act="scan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
          </svg>
          扫描
        </button>
      </div>
    </header>

    <main id="main" class="view" tabindex="-1">
      <div class="view-inner" id="viewRoot"></div>
    </main>
  </div>
</div>

<div id="overlayRoot"></div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="liveRegion" class="sr-only" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
