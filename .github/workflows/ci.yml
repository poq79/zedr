# CI 门禁：Windows/Linux 双平台 vet+test + 前端构建。
#
# 为什么 Windows 也跑全量 test：探针的 Windows 专属包（winapi/regwatch/
# evtlog）占检测面大头，只在 Linux 上跑测试等于放行了半座仓库。
# 注意：部分 winapi 测试在非管理员环境可能受限——首跑失败属"发现 CI
# 环境差异"而非代码问题，按实际输出收窄范围，不要静默 skip。
#
# 首跑实测（2026-11-21，run 44890432738）：web 绿；linux 死在 vet——
# cmd/diag 是 windows-only 包，linux ./... 必须能 vet 过（stub_other.go
# 占位）；windows 死在 test——runner 的 Defender 实时防护拦截测试二进制
# （EICAR/攻击链夹具与杀软天然互斥，v0.9.12 本机同款），禁实时防护后重跑。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      # 检测面测试夹具（EICAR/攻击链样本结构）会被 Defender 实时防护
      # 当作真实威胁拦截（Access is denied），runner 用完即销毁，
      # 禁用实时防护是安全产品 CI 的惯例做法，不影响 runner 隔离性。
      - name: disable Defender realtime protection
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: cross-compile windows agent/server
        run: |
          GOOS=windows GOARCH=amd64 go build ./cmd/server
          GOOS=windows GOARCH=amd64 go build ./cmd/agent

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run build
      # 构建产物上传为 artifact：开发机 node 环境不稳定（跨天回收）时，
      # bundle 从 CI 拉回入库（go:embed 消费路径），见 overview.md。
      - uses: actions/upload-artifact@v4
        with:
          name: webapp-static
          path: internal/server/web/static/
          retention-days: 14

  # Release 构建附件（推广备忘录待办）：推 tag 触发，四件套 zip 挂到
  # GitHub Release。构建口径与 scripts/build.sh 一致：禁 -s -w 剥符号
  # （§5.1：剥离符号会被判为加壳样本），版本注入三 main（-X main.version）。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: build all four (windows + linux)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for target in "windows amd64 .exe" "linux amd64 .linux"; do
            set -- $target
            GOOS=$1 GOARCH=$2 go build -ldflags "-X main.version=$VERSION" -o "zedr-server$3" ./cmd/server
            GOOS=$1 GOARCH=$2 go build -ldflags "-X main.version=$VERSION" -o "zedr-agent$3" ./cmd/agent
            GOOS=$1 GOARCH=$2 go build -ldflags "-X main.version=$VERSION" -o "zedr-ui$3" ./cmd/desktop
            GOOS=$1 GOARCH=$2 go build -ldflags "-X main.version=$VERSION" -o "zedr-diag$3" ./cmd/diag
            zip -j "zedr-deploy-$1.zip" "zedr-server$3" "zedr-agent$3" "zedr-ui$3" "zedr-diag$3"
          done
          ls -la *.zip
      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: zedr-deploy-*.zip
          generate_release_notes: true
